name: Schengen visa availability

on:
  workflow_dispatch:
    inputs:
      send_test_messages:
        description: Send two hosted Telegram tests (once)
        type: boolean
        default: false
      reset_login_block:
        description: Retry after correcting rejected login credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prenotami-visa
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-actions.txt
      - name: Test detection and encrypted state
        run: python -m unittest -v test_visa_watcher test_visa_runtime test_visa_actions
      - name: Verify installed stable Chrome
        run: |
          google-chrome --version
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel='chrome', headless=False)
              try:
                  page = browser.new_page()
                  page.set_content('<title>Browser readiness</title>')
                  assert page.title() == 'Browser readiness'
              finally:
                  browser.close()
          print('Installed stable Chrome is ready.')
          PY
      - name: Restore encrypted monitor state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .visa-ci/state.enc
          key: visa-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: visa-state-v1-
      - name: Check Prenotami once
        id: check
        env:
          PRENOTAMI_USERNAME: ${{ secrets.PRENOTAMI_USERNAME }}
          PRENOTAMI_PASSWORD: ${{ secrets.PRENOTAMI_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VISA_STATE_KEY: ${{ secrets.VISA_STATE_KEY }}
          VISA_DATA_DIR: ${{ runner.temp }}/visa-runtime
          VISA_SEND_TEST_MESSAGES: ${{ inputs.send_test_messages || false }}
          VISA_RESET_LOGIN_BLOCK: ${{ inputs.reset_login_block || false }}
        run: xvfb-run -a python visa_actions.py
      - name: Save encrypted monitor state
        if: ${{ always() && steps.check.outputs.state_saved == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .visa-ci/state.enc
          key: visa-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report check status
        if: always()
        env:
          AVAILABILITY: ${{ steps.check.outputs.availability || 'not checked' }}
        run: |
          echo "Verified availability: $AVAILABILITY" >> "$GITHUB_STEP_SUMMARY"
          echo 'Calendar access is an alert only; no reservation is submitted.' >> "$GITHUB_STEP_SUMMARY"
